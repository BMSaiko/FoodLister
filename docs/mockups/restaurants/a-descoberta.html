<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explorar Restaurantes - FoodLister (A descoberta)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>.panel{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.bar .sort{margin-left:auto}@media(max-width:600px){.bar .sort{margin-left:0}.bar .nstat{width:100%}}</style></head><body>
<header class="nav"><div class="logo"><i>F</i>FoodLister</div><div class="sch"><i data-ic="search"></i><span>Pesquisar restaurantes</span></div><small>Navbar existente (fora do âmbito)</small></header>
<main class="wrap">
<section id="hero" class="hero" aria-label="Sugestão de hoje"></section>
<div class="bar" role="toolbar" aria-label="Filtros">
<button class="btn ftoggle" data-t=".panel" aria-label="Filtros avançados"><i data-ic="sliders"></i>Filtros <span class="badge fbadge" style="display:none">0</span><i data-ic="chev"></i></button>
<button class="btn nearby" aria-label="Mostrar restaurantes perto de mim"><i data-ic="pin"></i>Perto de mim</button>
<select class="sel radius" aria-label="Raio de pesquisa" style="display:none"><option value="2">2 km</option><option value="5">5 km</option><option value="10">10 km</option><option value="25">25 km</option><option value="50">50 km</option><option value="100">100 km</option></select>
<span class="qchip"><span></span><button aria-label="Limpar pesquisa"><i data-ic="x"></i></button></span>
<button class="link clear" style="display:none"><i data-ic="x"></i>Limpar</button>
<select class="sel sort" aria-label="Ordenar"><option value="name:asc">Nome A-Z</option><option value="name:desc">Nome Z-A</option><option value="rating:desc">Rating (maior primeiro)</option><option value="price:asc">Preço ↑</option><option value="price:desc">Preço ↓</option><option value="popularity:desc">Populares</option><option value="random:asc">Aleatório</option></select>
<span class="meta cnt"></span><span class="nstat" role="status"></span></div>
<div class="panel"><div class="grp"><h4>Preço por pessoa</h4><div class="row"><label class="fld num"><span class="meta">€</span><input class="pmin" type="number" min="0" placeholder="Min" aria-label="Preço mínimo"></label><span class="meta">—</span><label class="fld num"><span class="meta">€</span><input class="pmax" type="number" min="0" placeholder="Max" aria-label="Preço máximo"></label></div></div>
<div class="grp"><h4>Rating mínimo</h4><div class="row"><button class="chip rate" data-r="1">1 <i data-ic="star"></i></button><button class="chip rate" data-r="2">2 <i data-ic="star"></i></button><button class="chip rate" data-r="3">3 <i data-ic="star"></i></button><button class="chip rate" data-r="4">4 <i data-ic="star"></i></button><button class="chip rate" data-r="5">5 <i data-ic="star"></i></button></div></div>
<div class="grp"><h4>Localização</h4><label class="fld"><i data-ic="pin"></i><input class="loc-in" type="text" placeholder="Cidade, país..." aria-label="Localização"></label></div>
<div class="grp cuis"><h4>Culinária</h4><p class="empty-note">Só aparece quando há tipos de cozinha nos restaurantes carregados (máx. 12, com contagem).</p></div></div>
<div id="grid" class="grid"></div>
<div class="grid sk" aria-hidden="true"><div class="skc"><i class="a"></i><i class="b"></i><i class="c"></i></div><div class="skc"><i class="a"></i><i class="b"></i><i class="c"></i></div><div class="skc"><i class="a"></i><i class="b"></i><i class="c"></i></div><div class="skc"><i class="a"></i><i class="b"></i><i class="c"></i></div><div class="skc"><i class="a"></i><i class="b"></i><i class="c"></i></div><div class="skc"><i class="a"></i><i class="b"></i><i class="c"></i></div><div class="skc"><i class="a"></i><i class="b"></i><i class="c"></i></div><div class="skc"><i class="a"></i><i class="b"></i><i class="c"></i></div><div class="skc"><i class="a"></i><i class="b"></i><i class="c"></i></div></div>
<div id="msg" class="msg" role="status"></div>
<div id="more" class="more" role="status">A carregar mais restaurantes...</div>
<p id="foot" class="foot"></p>
</main>
<a class="fab" href="#" title="Criar restaurante" aria-label="Criar restaurante"><i data-ic="plus"></i></a>
<script src="data.js"></script><script src="states.js"></script></body></html>
