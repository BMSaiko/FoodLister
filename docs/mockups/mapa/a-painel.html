<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa — A · Painel lateral</title><link rel="stylesheet" href="shared.css">
<style>
/* A: painel fixo à esquerda (desktop) com pesquisa, perto de mim e lista; mapa à direita. Mobile: mapa + painel que sobe como folha completa. */
.body{position:absolute;inset:52px 0 0 0;display:flex}
.panel{width:380px;flex:none;border-right:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;z-index:10}
.ph{padding:16px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.ph h1{margin:0;font-size:20px;letter-spacing:-.02em;font-weight:600}.ph h1 small{font-size:13px;color:var(--mut);font-weight:400;margin-left:6px}
.rows{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.list{flex:1;overflow:auto;padding:8px}.pf{padding:12px 16px;border-top:1px solid var(--line)}
.mapwrap{position:relative;flex:1}.mapwrap .map{position:absolute}
.zoom{right:16px;bottom:16px}
.fab{display:none;position:absolute;left:50%;bottom:92px;transform:translateX(-50%);z-index:9}
.close{display:none}
@container (max-width:700px){
  .panel{position:absolute;inset:0;width:auto;transform:translateY(100%);transition:transform .25s}
  .listopen .panel{transform:none}
  .fab{display:inline-flex}.close{display:inline-flex}
  .ph{padding:12px}
  .sbm{position:absolute;left:12px;right:12px;top:12px;z-index:7}
}
@container (min-width:701px){.sbm{display:none}}
@media(prefers-reduced-motion:reduce){.panel{transition:none}}
</style></head><body>
<div class="bar"><b style="align-self:center;color:var(--ph)">A · Painel lateral</b>
<button class="on" data-act="frame" data-v="d">Desktop</button><button data-act="frame" data-v="m">Mobile</button>
<button class="on" data-act="view" data-v="ok">Normal</button><button data-act="view" data-v="loading">A carregar</button><button data-act="view" data-v="error">Erro</button><button data-act="view" data-v="empty">Vazio</button>
<button data-act="near">Perto de mim</button></div>
<div class="stage"><div class="frame">
<div class="nav"><b>FoodLister</b><span class="lk">Restaurantes</span><span class="lk">Listas</span><span class="lk act">Mapa</span><span class="lk">Perfil</span></div>
<div class="body">
 <aside class="panel" aria-label="Restaurantes no mapa">
  <div class="ph">
   <h1>Restaurantes no mapa <small>(<span data-count>0</span>)</small></h1>
   <div class="input"><span aria-hidden="true">⌕</span><input data-q placeholder="Nome ou localização" aria-label="Pesquisar"><button data-act="clear" aria-label="Limpar pesquisa">✕</button></div>
   <div class="rows"><button class="chip" data-act="near">◎ Perto de mim</button><button class="btn ghost close" data-act="sheet" style="margin-left:auto">Ver mapa</button></div>
   <div class="radius" role="group" aria-label="Raio"><button class="chip" data-act="radius" data-v="2">2 km</button><button class="chip" data-act="radius" data-v="5">5 km</button><button class="chip on" data-act="radius" data-v="10">10 km</button><button class="chip" data-act="radius" data-v="25">25 km</button><button class="chip" data-act="radius" data-v="50">50 km</button><button class="chip" data-act="radius" data-v="100">100 km</button></div>
  </div>
  <div class="list" data-list></div>
  <div class="pf"><span class="warn" data-nc></span></div>
 </aside>
 <div class="mapwrap">
  <div class="sbm"><div class="input"><span aria-hidden="true">⌕</span><input data-q placeholder="Nome ou localização" aria-label="Pesquisar"><button data-act="clear" aria-label="Limpar">✕</button></div></div>
  <div class="map" id="map"><svg class="bg" viewBox="0 0 100 100" preserveAspectRatio="none"><g stroke="#1c1b17" fill="none"><path d="M0 70 Q30 55 60 62 T100 45" stroke-width="1.4"/><path d="M20 0 Q35 40 30 100" stroke-width="1"/><path d="M0 30 L100 20" stroke-width=".8"/><path d="M60 0 Q70 50 90 100" stroke-width=".8"/></g><path d="M0 88 Q30 80 55 90 T100 82 V100 H0Z" fill="#0b1119"/></svg></div>
  <div class="zoom"><button aria-label="Aproximar">+</button><button aria-label="Afastar">−</button><button aria-label="Repor zoom" data-act="reset">⌖</button></div>
  <button class="btn fab" data-act="sheet">Lista (<span data-count>0</span>)</button>
 </div>
</div>
<div class="msg load"><div><div class="spin"></div><p>A carregar mapa…</p></div></div>
<div class="msg err"><div><h3>Erro ao carregar mapa</h3><p>Não foi possível obter os restaurantes.</p><button class="btn" data-act="view" data-v="ok">Tentar novamente</button></div></div>
<div class="msg empty"><div><h3>Nenhum resultado</h3><p>Nenhum restaurante com coordenadas para mostrar.</p><button class="btn ghost" data-act="clear">Limpar pesquisa</button></div></div>
</div></div>
<script src="data.js"></script><script src="app.js"></script></body></html>
