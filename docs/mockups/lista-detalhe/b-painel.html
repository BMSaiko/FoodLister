 <div class="cm"><div class="av">RP</div><div><b>Rui P.</b> <span class="mut">há 1 semana</span><div>Falta a tasca de Gaia, já a adiciono.</div></div></div>
 <div class="row" style="margin-top:8px"><input aria-label="Novo comentário" placeholder="Escrever comentário" style="flex:1;min-height:44px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;color:inherit;padding:0 14px;font:inherit"><button class="btn pri">Enviar</button></div></section>`;}
function activity(){return `<section class="panel"><h3>Atividade</h3><div class="cm" style="border:0;padding-top:0"><div class="av">BS</div><div><b>${esc(LIST.creator)}</b> adicionou <b>Café Velasquez</b><div class="mut">há 3 dias</div></div></div><div class="cm"><div class="av">BS</div><div><b>${esc(LIST.creator)}</b> atualizou a lista<div class="mut">${fmtD('2026-06-21')}</div></div></div></section>`;}
function collab(){return `<section class="panel"><h3>Colaboradores · só dono</h3><div class="row"><span class="pill">Bruno Silva · dono</span><span class="pill">Ana M. · editora</span><button class="btn" style="min-height:36px">${ic('users')} Convidar</button></div></section>`;}
function nearby(){return `<div class="row"><button class="chip" id="nb" onclick="this.classList.toggle('on');$('#rad').hidden=!this.classList.contains('on')">${ic('pin')} Perto de mim</button><span id="rad" hidden class="mut" style="font-size:13px">raio <input type="range" min="1" max="50" value="10" aria-label="Raio em km"> 10 km · <b style="color:var(--ph)">7 a 10 km</b></span></div>`;}
function cuisineChips(){return ['Todas','Francesinha','Marisco','Tasca','Hambúrguer','Café'].map((c,i)=>`<button class="chip ${i?'':'on'}" onclick="document.querySelectorAll('.cz .chip').forEach(x=>x.classList.remove('on'));this.classList.add('on')">${c}</button>`).join('');}

let LAY='list',Q='',SORT='ord';
function setLay(l){LAY=l;render();}
function view(it){let o=it.filter(x=>(x.name+' '+x.loc).toLowerCase().includes(Q.toLowerCase()));
 const k={preco:(a,b)=>(a.price??1e9)-(b.price??1e9),rating:(a,b)=>(b.rating??-1)-(a.rating??-1),nome:(a,b)=>a.name.localeCompare(b.name,'pt')}[SORT];if(k)o=o.slice().sort(k);return o;}
function body(it){const v=view(it);
 if(!it.length)return `<div class="state"><b>Não há restaurantes nesta lista</b>Adiciona restaurantes a partir da página de cada restaurante.<br><br><a class="btn pri" href="#">Explorar restaurantes</a></div>`;
 if(!v.length)return `<div class="state"><img src="assets/tovi-a-pensar.svg" alt="" width="72" height="72"><b>Nenhum resultado para «${esc(Q)}»</b>Tenta outro nome ou morada.<br><br><button class="btn" onclick="Q='';render()">Limpar pesquisa</button></div>`;
 const n=`<div class="mut" style="font-size:13px;margin-bottom:10px" aria-live="polite">${v.length} de ${LIST.total} restaurantes</div>`;
 return n+(LAY==='list'?v.map(x=>`<a class="card lrow" href="#"><div class="t">${img(x)}</div><div class="n"><div class="nm">${esc(x.name)}</div><div class="lc" title="${esc(x.loc)}">${ic('pin')} ${esc(x.short)}</div></div><div class="r"><span class="pill">${price(x.price)}</span>${x.rating?`<span class="pill">${ic('star')} ${x.rating}</span>`:''}<button class="btn ic" style="border:0;color:var(--err);background:none" aria-label="Remover ${esc(x.name)}" onclick="event.preventDefault();confirm('Remover? (mockup)')">${ic('trash')}</button></div></a>`).join(''):
 `<div class="tiles">${v.map(x=>`<a class="card" href="#"><div class="im">${img(x)}</div><div class="bd"><div class="nm">${esc(x.name)}</div><div class="lc" title="${esc(x.loc)}">${esc(x.short)} · ${price(x.price)}</div></div><button class="rm" aria-label="Remover ${esc(x.name)}" onclick="event.preventDefault();confirm('Remover? (mockup)')">${ic('trash')}</button></a>`).join('')}</div>`);}
function upd(){$('#res').innerHTML=body(STATE==='vazio'?[]:items());}
function render(){const app=$('#app');
 if(STATE==='404'){app.innerHTML=notFound();return;}
 const it=STATE==='vazio'?[]:items();
 if(STATE==='loading'){app.innerHTML=`<div class="wrap"><div class="shell"><div class="skel" style="height:520px"></div><div style="display:grid;gap:8px">${'<div class="skel" style="height:96px"></div>'.repeat(7)}</div></div></div>`;return;}
 const side=`<aside class="side"><a class="back" href="#">${ic('back')} Listas</a>
  <div class="panel">${cover(LIST.name,96)}<div class="row" style="margin:14px 0 12px"><span class="badge">Pública</span><span class="mut">${LIST.total} restaurantes</span></div>
  <h1>${esc(LIST.name)}</h1><p class="mut" style="margin:10px 0">${esc(LIST.desc)}</p>
  <div class="row" style="margin-bottom:14px">${LIST.tags.map(t=>`<span class="pill">#${esc(t)}</span>`).join('')}</div>
  <div class="mut" style="font-size:13px">Criada por <a href="#" style="color:var(--ph)">${esc(LIST.creator)}</a><br>${fmtD(LIST.created)}</div>
  <div class="row" style="margin-top:16px"><button class="btn pri" style="flex:1;justify-content:center" ${it.length?'':'disabled'}>${ic('dice')} Roleta</button>${moreMenu()}</div>
  <div class="row" style="margin-top:10px"><button class="btn" style="flex:1;justify-content:center">${ic('heart')} 12</button><button class="btn ic" aria-label="Partilhar">${ic('share')}</button><a class="btn ic" href="#" aria-label="Editar">${ic('edit')}</a></div></div>
  ${it.length?`<div class="panel"><h3>Estatísticas</h3><div class="big"><div><b>${LIST.avgRating??'-'}</b><span>rating médio · ${LIST.ratedCount} com rating</span></div><div><b>${LIST.avgPrice} €</b><span>preço médio · ${LIST.pricedCount} com preço</span></div><div><b>${LIST.places}</b><span>locais únicos</span></div><div><b>${LIST.noimg}</b><span>sem imagem</span></div></div>
  <div style="margin-top:14px;font-size:12px" class="mut">Com preço</div><div class="bar"><i style="width:${Math.round(LIST.pricedCount/LIST.total*100)}%"></i></div>
  <div style="margin-top:10px;font-size:12px" class="mut">Com imagem</div><div class="bar"><i style="width:${Math.round((LIST.total-LIST.noimg)/LIST.total*100)}%"></i></div></div>`:''}
  ${collab()}</aside>`;
 const list=it.length?(LAY==='list'?it.map(x=>`<a class="card lrow" href="#"><div class="t">${img(x)}</div><div class="n"><div class="nm">${esc(x.name)}</div><div class="lc">${ic('pin')} ${esc(x.loc)}</div></div><div class="r"><span class="pill">${price(x.price)}</span>${x.rating?`<span class="pill">${ic('star')} ${x.rating}</span>`:''}<button class="btn ic" style="border:0;color:var(--err);background:none" aria-label="Remover ${esc(x.name)}" onclick="event.preventDefault();confirm('Remover? (mockup)')">${ic('trash')}</button></div></a>`).join(''):
  `<div class="tiles">${it.map(x=>`<a class="card" href="#"><div class="im">${img(x)}</div><div class="bd"><div class="nm">${esc(x.name)}</div><div class="lc">${price(x.price)}</div></div><button class="rm" aria-label="Remover ${esc(x.name)}" onclick="event.preventDefault();confirm('Remover? (mockup)')">${ic('trash')}</button></a>`).join('')}</div>`):
  `<div class="state"><b>Não há restaurantes nesta lista</b>Adiciona restaurantes a partir da página de cada restaurante.<br><br><a class="btn pri" href="#">Explorar restaurantes</a></div>`;
 app.innerHTML=`<div class="wrap">${STATE==='erro'?`<div class="banner" role="alert">Não foi possível carregar os restaurantes. <a href="#" style="text-decoration:underline">Tentar de novo</a></div>`:''}
 <div class="shell">${side}<main><div class="tools"><div class="row cz">${cuisineChips()}</div><div class="row"><button class="chip">${ic('filter')} Filtros</button><div class="seg" role="group" aria-label="Vista"><button class="${LAY==='list'?'on':''}" aria-label="Lista" onclick="setLay('list')">${ic('list')}</button><button class="${LAY==='tiles'?'on':''}" aria-label="Mosaico" onclick="setLay('tiles')">${ic('grid')}</button></div></div></div>
 <div class="tools" style="margin-bottom:10px"><div class="row" style="flex:1"><input id="q" type="search" value="${esc(Q)}" placeholder="Pesquisar por nome ou morada" aria-label="Pesquisar restaurantes" oninput="Q=this.value;upd()" style="flex:1;min-width:180px;min-height:44px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;color:inherit;padding:0 14px;font:inherit"><select aria-label="Ordenar" onchange="SORT=this.value;upd()" style="min-height:44px;background:#111;border:1px solid var(--line);border-radius:10px;color:inherit;padding:0 12px;font:inherit"><option value="ord" ${SORT==='ord'?'selected':''}>Ordem da lista</option><option value="nome" ${SORT==='nome'?'selected':''}>Nome</option><option value="preco" ${SORT==='preco'?'selected':''}>Preço</option><option value="rating" ${SORT==='rating'?'selected':''}>Rating</option></select></div>${nearby()}</div><div id="res">${body(it)}</div>
 <div style="display:grid;gap:16px;margin-top:32px">${LIST.total?comments():''}${activity()}</div></main></div></div>`;}

$('#sb').innerHTML=bar();setState('normal');</script></body></html>
